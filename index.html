<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0c">
  <title>CSR Boardroom Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="csr-boardroom.css">
  <style>
    .landing-main { display: flex; align-items: center; min-height: calc(100vh - 72px); }
    .landing-card { width: min(520px, calc(100% - 48px)); margin: 0 auto; text-align: center; }
    .landing-card h1 { margin: 18px 0 13px; font: 800 clamp(2rem, 6vw, 3rem)/1.1 Orbitron, sans-serif; letter-spacing: -.05em; }
    .landing-card h1 span { color: var(--gold); }
    .landing-card > p { margin: 0 0 32px; color: var(--muted); font-size: .95rem; line-height: 1.7; }
    .landing-choices { display: grid; gap: 14px; }
    .landing-choices a { display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .landing-choices .btn-primary { margin-top: 0; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="orb orb-gold" aria-hidden="true"></div>
  <div class="orb orb-cyan" aria-hidden="true"></div>

  <header class="site-header">
    <span class="site-wordmark">
      <span class="site-title">BECG SIMULATION</span>
      <span class="site-tag">CSR Boardroom Challenge</span>
    </span>
  </header>

  <main class="app landing-main">
    <div class="landing-card">
      <div class="eyebrow" style="justify-content:center;"><span class="live-dot"></span> BECG CLASSROOM SIMULATION</div>
      <h1>CSR BOARDROOM<br><span>CHALLENGE</span></h1>
      <p>Choose how you're joining the challenge.</p>
      <div class="landing-choices">
        <a class="btn-primary" href="csr-team.html">Enter as a Team <span aria-hidden="true">→</span></a>
        <a class="btn-secondary" href="csr-boardroom.html">Enter as Facilitator <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </main>
</body>
</html>
